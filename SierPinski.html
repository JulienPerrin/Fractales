<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Triangle de Sierpinski | Fractales</title>
    <link rel="icon" type="image/ico" href="favicon.ico" />
    <link rel="stylesheet" type="text/css" href="css/style.css" />
  </head>
  <body>
    <main>
      <h1>Triangle de Sierpinski</h1>
      <p>
        Cette page utilise un algorithme simple pour dessiner le triangle de
        SierPinski. Pour faire varier le nombre de pixels simulés, modifier la
        valeur « Largeur » et valider le formulaire.
      </p>
      <canvas
        id="fractale"
        width="600"
        height="519"
        role="img"
        aria-label="Triangle de Sierpinski"
      ></canvas>
      <form>
        <input
          type="checkbox"
          id="asynchrone"
          name="asynchrone"
          checked
        />
        <label for="asynchrone">Asynchrone</label><br />
        <label for="intervalleTemps">
          Intervalle d'apparition d'un nouveau point (ms) :
        </label>
        <input
          type="number"
          class="form-control"
          value="1"
          min="0"
          name="intervalleTemps"
          id="intervalleTemps"
          required
        /><br />
        <label for="width">Largeur (px) :</label>
        <input
          type="number"
          class="form-control"
          value="600"
          min="1"
          id="width"
          name="width"
          required
        /><br />
        <input
          type="checkbox"
          id="legende"
          name="legende"
          checked
        />
        <label for="legende">Ajouter légende</label><br />
        <button type="submit" id="btnPrecise">Appliquer</button>
      </form>
    </main>
  </body>
  <script type="module" src="/src/sierpinski.ts"></script>
</html>
